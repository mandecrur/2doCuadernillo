<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Práctica Cuadernillo II - 100 ejercicios</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#17202a}
.container{max-width:760px;margin:auto;padding:18px}
header{background:#17365d;color:white;border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:23px;margin:0 0 6px} .sub{opacity:.9;font-size:14px}
.stats{display:flex;gap:10px;margin:12px 0;position:sticky;top:0;z-index:5}
.stat{flex:1;background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #0001;font-weight:bold}
#correct{color:#16803a} #wrong{color:#c62828}
.progress{height:9px;background:#dce3ea;border-radius:20px;overflow:hidden;margin:10px 0 16px}
#bar{height:100%;width:0%;background:#2e75b6;transition:.25s}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 3px 14px #0001}
.tag{display:inline-block;background:#e8f1fb;color:#174a7c;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:bold;margin-bottom:14px}
.num{font-size:13px;color:#667085;margin-bottom:8px}
.question{font-size:21px;font-weight:700;line-height:1.4;margin-bottom:20px}
.option{display:block;width:100%;text-align:left;border:2px solid #d8dee6;background:#fff;border-radius:12px;padding:14px;margin:10px 0;font-size:16px;cursor:pointer;transition:.15s;touch-action:manipulation}
.option:hover{border-color:#6c9fd1;background:#f7fbff}
.option.correct{border-color:#2e8b57;background:#eaf8ef}
.option.incorrect{border-color:#d64545;background:#fff0f0}
.option:disabled{cursor:default}
.feedback{margin-top:15px;padding:13px;border-radius:12px;display:none;line-height:1.45}
.feedback.ok{display:block;background:#eaf8ef;color:#176b35}
.feedback.no{display:block;background:#fff0f0;color:#9b2226}
.next{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:#17365d;color:white;font-size:16px;font-weight:bold;cursor:pointer;display:none}
.final{display:none;text-align:center}
.final h2{font-size:28px}
.reset{border:0;background:#17365d;color:white;border-radius:12px;padding:13px 20px;font-weight:bold;cursor:pointer}
@media(max-width:520px){.container{padding:10px}header{padding:16px}h1{font-size:20px}.card{padding:17px}.question{font-size:19px}.option{font-size:15px;padding:13px}}
</style>
</head>
<body>
<div class="container">
<header>
<h1>Práctica interactiva — Cuadernillo II</h1>
<div class="sub">100 ejercicios basados en los contenidos del cuadernillo. Selecciona una alternativa y la respuesta se comprobará automáticamente.</div>
</header>
<div class="stats">
<div class="stat">Correctas<br><span id="correct">0</span></div>
<div class="stat">Incorrectas<br><span id="wrong">0</span></div>
<div class="stat">Pregunta<br><span id="current">1/100</span></div>
</div>
<div class="progress"><div id="bar"></div></div>

<div id="quiz" class="card">
<div id="tag" class="tag"></div>
<div id="qnum" class="num"></div>
<div id="question" class="question"></div>
<div id="options"></div>
<div id="feedback" class="feedback"></div>
<button id="next" class="next" onclick="nextQuestion()">Siguiente →</button>
</div>

<div id="final" class="card final">
<h2>¡Práctica terminada!</h2>
<p id="result"></p>
<button class="reset" onclick="restart()">Reiniciar práctica</button>
</div>
</div>

<script>
const questions = [{"t": "Adjetivos de tamaño", "q": "Elige la palabra correcta: It is a ___ dog.", "o": ["round", "big", "under"], "a": 1, "e": "Big es un adjetivo de tamaño y va antes del sustantivo."}, {"t": "Adjetivos de tamaño", "q": "Elige la frase correcta.", "o": ["a red big ball", "a ball big red", "a big red ball"], "a": 2, "e": "El cuadernillo indica que el tamaño suele ir antes del color: a big red ball."}, {"t": "Adjetivos de tamaño", "q": "Which word means “pequeño”?", "o": ["Huge", "Small", "Wide"], "a": 1, "e": "Small significa pequeño."}, {"t": "Adjetivos de tamaño", "q": "Elige la oración correcta.", "o": ["A tall boy.", "A boy tall.", "Tall a boy."], "a": 0, "e": "El adjetivo de tamaño va antes del sustantivo."}, {"t": "Adjetivos de tamaño", "q": "Which adjective means “enorme”?", "o": ["Huge", "Tiny", "Short"], "a": 0, "e": "Huge significa enorme."}, {"t": "Adjetivos de tamaño", "q": "Elige la frase correcta.", "o": ["a pencil long", "long a pencil", "a long pencil"], "a": 2, "e": "Long es un adjetivo de tamaño y se coloca antes del sustantivo."}, {"t": "Adjetivos de forma", "q": "Which word means “redondo”?", "o": ["Round", "Square", "Flat"], "a": 0, "e": "Round significa redondo."}, {"t": "Adjetivos de forma", "q": "Elige la frase correcta.", "o": ["a window square", "square a window", "a square window"], "a": 2, "e": "El adjetivo de forma va antes del sustantivo."}, {"t": "Adjetivos de forma", "q": "Elige la frase correcta.", "o": ["a small rectangular box", "a rectangular small box", "a box rectangular small"], "a": 0, "e": "El cuadernillo presenta el orden: tamaño + forma + sustantivo."}, {"t": "Adjetivos de forma", "q": "Which word means “ovalado”?", "o": ["Oval", "Curved", "Pointed"], "a": 0, "e": "Oval significa ovalado."}, {"t": "Adjetivos de forma", "q": "Elige la oración correcta.", "o": ["a big circular sign", "a circular big sign", "a sign big circular"], "a": 0, "e": "En el ejemplo del cuadernillo, el tamaño aparece antes de la forma."}, {"t": "Adjetivos de forma", "q": "Which word means “triangular”?", "o": ["Triangular", "Straight", "Flat"], "a": 0, "e": "Triangular significa triangular."}, {"t": "Preposiciones de lugar", "q": "The cat is ___ the table.", "o": ["between", "behind", "on"], "a": 2, "e": "On significa sobre/en una superficie."}, {"t": "Preposiciones de lugar", "q": "The pen is ___ the desk.", "o": ["above", "under", "next to"], "a": 1, "e": "Under significa debajo de."}, {"t": "Preposiciones de lugar", "q": "The dog is ___ the door.", "o": ["below", "between", "next to"], "a": 2, "e": "Next to significa al lado de."}, {"t": "Preposiciones de lugar", "q": "The boy is ___ the curtain.", "o": ["above", "in", "behind"], "a": 2, "e": "Behind significa detrás de."}, {"t": "Preposiciones de lugar", "q": "The teacher is ___ the board.", "o": ["in front of", "under", "between"], "a": 0, "e": "In front of significa delante de."}, {"t": "Preposiciones de lugar", "q": "The ball is ___ the shoes.", "o": ["behind", "between", "above"], "a": 1, "e": "Between significa entre dos elementos."}, {"t": "Adjetivos calificativos", "q": "Which word means “feliz”?", "o": ["Sad", "Happy", "Weak"], "a": 1, "e": "Happy significa feliz."}, {"t": "Adjetivos calificativos", "q": "Elige la oración correcta.", "o": ["He strong is.", "He is strong.", "Strong he is."], "a": 1, "e": "Los adjetivos calificativos pueden ir después de to be."}, {"t": "Adjetivos calificativos", "q": "Elige la frase correcta.", "o": ["a happy child", "a child happy", "happy a child"], "a": 0, "e": "También pueden ir antes del sustantivo."}, {"t": "Adjetivos calificativos", "q": "Which word means “enojado”?", "o": ["Friendly", "Nice", "Angry"], "a": 2, "e": "Angry significa enojado."}, {"t": "Adjetivos calificativos", "q": "Elige la oración correcta.", "o": ["They friendly are.", "Friendly they are.", "They are friendly."], "a": 2, "e": "Con to be, el adjetivo va después del verbo."}, {"t": "Adjetivos calificativos", "q": "Which word means “valiente”?", "o": ["Brave", "Funny", "Weak"], "a": 0, "e": "Brave significa valiente."}, {"t": "Pronombres posesivos", "q": "This is ___ book.", "o": ["me", "my", "I"], "a": 1, "e": "My indica posesión y va antes del sustantivo."}, {"t": "Pronombres posesivos", "q": "Is this ___ pencil?", "o": ["you", "your", "yours"], "a": 1, "e": "Your se usa antes del sustantivo para indicar posesión."}, {"t": "Pronombres posesivos", "q": "___ car is blue.", "o": ["He", "His", "Him"], "a": 1, "e": "His significa su/de él y se coloca antes del sustantivo."}, {"t": "Pronombres posesivos", "q": "___ dog is friendly.", "o": ["She", "Hers", "Her"], "a": 2, "e": "Her significa su/de ella y va antes del sustantivo."}, {"t": "Pronombres posesivos", "q": "The cat eats ___ food.", "o": ["its", "it", "it's"], "a": 0, "e": "Its indica posesión para animales o cosas."}, {"t": "Pronombres posesivos", "q": "___ school is big.", "o": ["We", "Our", "Us"], "a": 1, "e": "Our significa nuestro/nuestra y va antes del sustantivo."}, {"t": "Preguntas simples", "q": "___ is your name?", "o": ["Where", "When", "What"], "a": 2, "e": "What se usa para preguntar qué/cuál."}, {"t": "Preguntas simples", "q": "___ do you live?", "o": ["Who", "What", "Where"], "a": 2, "e": "Where se usa para preguntar por un lugar."}, {"t": "Preguntas simples", "q": "___ is your teacher?", "o": ["When", "Where", "Who"], "a": 2, "e": "Who se usa para preguntar por personas."}, {"t": "Preguntas simples", "q": "___ is your birthday?", "o": ["What", "Who", "When"], "a": 2, "e": "When se usa para preguntar por el tiempo o una fecha."}, {"t": "Preguntas simples", "q": "___ is your backpack?", "o": ["Who", "When", "Where"], "a": 2, "e": "Where pregunta por la ubicación."}, {"t": "Preguntas simples", "q": "___ plays the guitar?", "o": ["Who", "Where", "When"], "a": 0, "e": "Who pregunta por la persona que realiza la acción."}, {"t": "Presente simple afirmativo", "q": "I ___ breakfast at 7.", "o": ["eats", "eat", "eating"], "a": 1, "e": "Con I se usa el verbo en forma base: eat."}, {"t": "Presente simple afirmativo", "q": "He ___ to school.", "o": ["go", "going", "goes"], "a": 2, "e": "Con he, el verbo go cambia a goes."}, {"t": "Presente simple afirmativo", "q": "She ___ a book every night.", "o": ["read", "reading", "reads"], "a": 2, "e": "Con she se añade -s: reads."}, {"t": "Presente simple afirmativo", "q": "They ___ English.", "o": ["studies", "studying", "study"], "a": 2, "e": "Con they se usa la forma base: study."}, {"t": "Presente simple afirmativo", "q": "He ___ TV at night.", "o": ["watches", "watch", "watching"], "a": 0, "e": "Con he, watch cambia a watches."}, {"t": "Presente simple afirmativo", "q": "We ___ from Monday to Friday.", "o": ["work", "works", "working"], "a": 0, "e": "Con we se usa la forma base: work."}, {"t": "Presente simple negativo", "q": "I ___ eat meat.", "o": ["doesn't", "don't", "not"], "a": 1, "e": "Con I se usa don't + verbo base."}, {"t": "Presente simple negativo", "q": "He ___ study on Sundays.", "o": ["don't", "isn't", "doesn't"], "a": 2, "e": "Con he se usa doesn't + verbo base."}, {"t": "Presente simple negativo", "q": "She doesn't ___ coffee.", "o": ["drink", "drinks", "drinking"], "a": 0, "e": "Después de doesn't, el verbo permanece en forma base."}, {"t": "Presente simple negativo", "q": "They ___ watch TV in the morning.", "o": ["doesn't", "don't", "aren't"], "a": 1, "e": "Con they se usa don't."}, {"t": "Presente simple negativo", "q": "He doesn't ___ to school.", "o": ["goes", "going", "go"], "a": 2, "e": "Después de doesn't se usa go, no goes."}, {"t": "Presente simple negativo", "q": "We ___ live in Lima.", "o": ["doesn't", "isn't", "don't"], "a": 2, "e": "Con we se usa don't."}, {"t": "Presente simple negativo", "q": "It doesn't ___ at night.", "o": ["sleeps", "sleep", "sleeping"], "a": 1, "e": "Después de doesn't se usa el verbo base: sleep."}, {"t": "Presente simple interrogativo", "q": "___ you study English?", "o": ["Does", "Do", "Are"], "a": 1, "e": "Con you se usa Do + sujeto + verbo base."}, {"t": "Presente simple interrogativo", "q": "___ he play the guitar?", "o": ["Does", "Do", "Is"], "a": 0, "e": "Con he se usa Does."}, {"t": "Presente simple interrogativo", "q": "Does she ___ coffee?", "o": ["drinks", "drink", "drinking"], "a": 1, "e": "Después de does se usa el verbo base."}, {"t": "Presente simple interrogativo", "q": "___ they watch TV at night?", "o": ["Do", "Does", "Are"], "a": 0, "e": "Con they se usa Do."}, {"t": "Presente simple interrogativo", "q": "Does he ___ a lot?", "o": ["studies", "studying", "study"], "a": 2, "e": "Después de does, el verbo va en forma base."}, {"t": "Presente simple interrogativo", "q": "___ we work on Fridays?", "o": ["Does", "Do", "Are"], "a": 1, "e": "Con we se usa Do."}, {"t": "Presente simple interrogativo", "q": "Does she ___ chocolate?", "o": ["likes", "liking", "like"], "a": 2, "e": "Después de does se usa like."}, {"t": "Can / Can't", "q": "I ___ swim.", "o": ["can", "do", "can’t"], "a": 0, "e": "Can expresa habilidad: I can swim."}, {"t": "Can / Can't", "q": "He ___ dance.", "o": ["can", "does", "ca’t"], "a": 0, "e": "Can va seguido del verbo base."}, {"t": "Can / Can't", "q": "Elige la oración correcta.", "o": ["She can draws.", "She can to draw.", "She can draw."], "a": 2, "e": "La estructura es sujeto + can + verbo base."}, {"t": "Can / Can't", "q": "Elige la oración correcta para expresar incapacidad.", "o": ["He can dance.", "He doesn't can dance.", "He can't dance."], "a": 2, "e": "Can't indica que alguien no puede hacer algo."}, {"t": "Can / Can't", "q": "___ she draw?", "o": ["Can", "Does", "Is"], "a": 0, "e": "La interrogativa se forma Can + sujeto + verbo base."}, {"t": "Can / Can't", "q": "Yes, she ___.", "o": ["does", "can", "is"], "a": 1, "e": "La respuesta corta afirmativa es Yes, she can."}, {"t": "Can / Can't", "q": "They can ___ English.", "o": ["speaks", "speak", "speaking"], "a": 1, "e": "Después de can se usa el verbo base."}, {"t": "Verb to have", "q": "I ___ a computer.", "o": ["has", "have", "do"], "a": 1, "e": "Con I se usa have."}, {"t": "Verb to have", "q": "She ___ a pet.", "o": ["have", "has", "haves"], "a": 1, "e": "Con she se usa has."}, {"t": "Verb to have", "q": "They ___ a bike.", "o": ["have", "has", "had"], "a": 0, "e": "Con they se usa have."}, {"t": "Verb to have", "q": "He ___ a pencil.", "o": ["has", "have", "is"], "a": 0, "e": "Con he se usa has."}, {"t": "Verb to have", "q": "___ you have a ball?", "o": ["Do", "Does", "Are"], "a": 0, "e": "Con you, la pregunta usa Do you have...?"}, {"t": "Verb to have", "q": "___ she have a computer?", "o": ["Does", "Do", "Is"], "a": 0, "e": "Con she se usa Does, pero el verbo principal queda en have."}, {"t": "Verb to have", "q": "He ___ have a brother.", "o": ["don't", "doesn't", "isn't"], "a": 1, "e": "Con he se usa doesn't + have."}, {"t": "Preposiciones de tiempo", "q": "I was born ___ June.", "o": ["in", "on", "at"], "a": 0, "e": "In se usa con meses."}, {"t": "Preposiciones de tiempo", "q": "She studies ___ the morning.", "o": ["on", "at", "in"], "a": 2, "e": "In se usa con momentos del día como in the morning."}, {"t": "Preposiciones de tiempo", "q": "The class starts ___ 8:00.", "o": ["at", "in", "on"], "a": 0, "e": "At se usa con horas."}, {"t": "Preposiciones de tiempo", "q": "My birthday is ___ Monday.", "o": ["at", "on", "in"], "a": 1, "e": "On se usa con días."}, {"t": "Preposiciones de tiempo", "q": "I sleep ___ midnight.", "o": ["at", "on", "in"], "a": 0, "e": "At se usa con momentos exactos como midnight."}, {"t": "Preposiciones de tiempo", "q": "The event is ___ January 1st.", "o": ["in", "on", "at"], "a": 1, "e": "On se usa con fechas exactas."}, {"t": "Preposiciones de tiempo", "q": "We go to the beach ___ August.", "o": ["in", "on", "at"], "a": 0, "e": "In se usa con meses."}, {"t": "Conjunciones", "q": "I like pizza ___ burgers.", "o": ["because", "or", "and"], "a": 2, "e": "And une ideas similares: pizza and burgers."}, {"t": "Conjunciones", "q": "She is cold ___ she has no jacket.", "o": ["because", "but", "or"], "a": 0, "e": "Because introduce una razón."}, {"t": "Conjunciones", "q": "Do you want tea ___ coffee?", "o": ["or", "and", "but"], "a": 0, "e": "Or ofrece opciones."}, {"t": "Conjunciones", "q": "She is tired ___ happy.", "o": ["and", "because", "or"], "a": 0, "e": "And une dos ideas."}, {"t": "Conjunciones", "q": "He is tall ___ he can't play basketball.", "o": ["because", "but", "or"], "a": 1, "e": "But contrasta dos ideas."}, {"t": "Conjunciones", "q": "I'm sad ___ my dog is sick.", "o": ["but", "because", "or"], "a": 1, "e": "Because da la razón de estar triste."}, {"t": "Conjunciones", "q": "We can go to the park ___ the beach.", "o": ["or", "and", "because"], "a": 0, "e": "Or presenta una opción entre dos lugares."}, {"t": "Adverbios de frecuencia", "q": "I ___ eat breakfast.", "o": ["never", "always", "sometimes"], "a": 1, "e": "Always significa siempre."}, {"t": "Adverbios de frecuencia", "q": "She ___ eats vegetables. She hates them!", "o": ["always", "never", "often"], "a": 1, "e": "Never significa nunca."}, {"t": "Adverbios de frecuencia", "q": "We ___ play soccer.", "o": ["never", "always", "often"], "a": 2, "e": "Often significa a menudo/frecuentemente."}, {"t": "Adverbios de frecuencia", "q": "They ___ watch TV.", "o": ["never", "always", "sometimes"], "a": 2, "e": "Sometimes significa a veces."}, {"t": "Adverbios de frecuencia", "q": "He ___ studies at night.", "o": ["never", "sometimes", "usually"], "a": 2, "e": "Usually significa usualmente."}, {"t": "Adverbios de frecuencia", "q": "Elige la oración correcta.", "o": ["I eat always breakfast.", "Always I eat breakfast.", "I always eat breakfast."], "a": 2, "e": "Con el verbo principal, el adverbio va antes del verbo."}, {"t": "Adverbios de frecuencia", "q": "Elige la oración correcta con el verbo to be.", "o": ["She always is happy.", "Always she is happy.", "She is always happy."], "a": 2, "e": "Con to be, el adverbio va después del verbo."}, {"t": "Imperativos", "q": "___ your name on the line.", "o": ["Writes", "Write", "Writing"], "a": 1, "e": "El imperativo usa el verbo en forma base, sin sujeto."}, {"t": "Imperativos", "q": "___ the door, please.", "o": ["Close", "Closing", "Closes"], "a": 0, "e": "Close es la forma base del verbo."}, {"t": "Imperativos", "q": "___ down and be quiet.", "o": ["Sits", "Sit", "Sitting"], "a": 1, "e": "Sit down es un imperativo."}, {"t": "Imperativos", "q": "___ talk in class.", "o": ["No", "Not", "Don't"], "a": 2, "e": "El imperativo negativo se forma con don't + verbo base."}, {"t": "Imperativos", "q": "___ to the teacher.", "o": ["Listens", "Listening", "Listen"], "a": 2, "e": "Listen to the teacher es una instrucción."}, {"t": "Imperativos", "q": "___ your book to page 10.", "o": ["Opens", "Open", "Opening"], "a": 1, "e": "Open es la forma base del imperativo."}, {"t": "Imperativos", "q": "___ be late!", "o": ["Doesn't", "Don't", "Isn't"], "a": 1, "e": "Don't + verbo base forma el imperativo negativo."}, {"t": "Repaso", "q": "Elige la oración correcta.", "o": ["She have a pet and she happy is.", "She has a pet and she is happy.", "She has pet but is happy."], "a": 1, "e": "La oración combina have/has, adjetivo calificativo y la conjunción and."}, {"t": "Repaso", "q": "Elige la oración correcta.", "o": ["I can swim, but I can't run fast.", "I can swims, but I can't runs fast.", "I can to swim, but I don't can run fast."], "a": 0, "e": "Después de can/can't se usa el verbo base; but expresa contraste."}];
let index=0, correct=0, wrong=0, answered=false;

function render(){
  answered=false;
  const q=questions[index];
  document.getElementById('tag').textContent=q.t;
  document.getElementById('qnum').textContent='Pregunta '+(index+1)+' de '+questions.length;
  document.getElementById('current').textContent=(index+1)+'/'+questions.length;
  document.getElementById('question').textContent=q.q;
  document.getElementById('bar').style.width=((index)/questions.length*100)+'%';
  const box=document.getElementById('options');
  box.innerHTML='';
  q.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.textContent=String.fromCharCode(65+i)+') '+opt;
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  const f=document.getElementById('feedback');
  f.className='feedback'; f.innerHTML='';
  document.getElementById('next').style.display='none';
}

function answer(choice){
  if(answered) return;
  answered=true;
  const q=questions[index];
  const buttons=document.querySelectorAll('.option');
  buttons.forEach((b,i)=>{b.disabled=true; if(i===q.a)b.classList.add('correct')});
  const f=document.getElementById('feedback');
  if(choice===q.a){
    correct++;
    f.className='feedback ok';
    f.innerHTML='<strong>✓ Correcto.</strong> '+q.e;
  } else {
    wrong++;
    buttons[choice].classList.add('incorrect');
    f.className='feedback no';
    f.innerHTML='<strong>✗ Incorrecto.</strong> La respuesta correcta es <strong>'+String.fromCharCode(65+q.a)+') '+q.o[q.a]+'</strong>. '+q.e;
  }
  document.getElementById('correct').textContent=correct;
  document.getElementById('wrong').textContent=wrong;
  document.getElementById('next').style.display='block';
}

function nextQuestion(){
  index++;
  if(index>=questions.length) finish(); else render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('final').style.display='block';
  document.getElementById('bar').style.width='100%';
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('result').innerHTML='<strong>'+correct+' correctas</strong> y <strong>'+wrong+' incorrectas</strong>.<br>Resultado: <strong>'+pct+'%</strong>';
}

function restart(){
  index=0; correct=0; wrong=0;
  document.getElementById('correct').textContent='0';
  document.getElementById('wrong').textContent='0';
  document.getElementById('final').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>

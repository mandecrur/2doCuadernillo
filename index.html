*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#17202a}

header{background:#17365d;color:white;border-radius:16px;padding:20px;margin-bottom:14px}
h1{font-size:23px;margin:0 0 6px} .sub{opacity:.9;font-size:14px}
.stats{display:flex;gap:10px;margin:12px 0;position:sticky;top:0;z-index:5}
.stat{flex:1;background:white;border-radius:12px;padding:10px;text-align:center;box-shadow:0 2px 8px #0001;font-weight:bold}

.progress{height:9px;background:#dce3ea;border-radius:20px;overflow:hidden;margin:10px 0 16px}
#bar{height:100%;width:0%;background:#2e75b6;transition:.25s}
.card{background:white;border-radius:18px;padding:22px;box-shadow:0 3px 14px #0001}
.tag{display:inline-block;background:#e8f1fb;color:#174a7c;padding:6px 10px;border-radius:20px;font-size:13px;font-weight:bold;margin-bottom:14px}
.num{font-size:13px;color:#667085;margin-bottom:8px}
.question{font-size:21px;font-weight:700;line-height:1.4;margin-bottom:20px}
.option{display:block;width:100%;text-align:left;border:2px solid #d8dee6;background:#fff;border-radius:12px;padding:14px;margin:10px 0;font-size:16px;cursor:pointer;transition:.15s;touch-action:manipulation}
.option:hover{border-color:#6c9fd1;background:#f7fbff}
.option.correct{border-color:#2e8b57;background:#eaf8ef}
.option.incorrect{border-color:#d64545;background:#fff0f0}
.option:disabled{cursor:default}
.feedback{margin-top:15px;padding:13px;border-radius:12px;display:none;line-height:1.45}
.feedback.ok{display:block;background:#eaf8ef;color:#176b35}
.feedback.no{display:block;background:#fff0f0;color:#9b2226}
.next{width:100%;margin-top:16px;border:0;border-radius:12px;padding:14px;background:#17365d;color:white;font-size:16px;font-weight:bold;cursor:pointer;display:none}
.final{display:none;text-align:center}
.final h2{font-size:28px}
.reset{border:0;background:#17365d;color:white;border-radius:12px;padding:13px 20px;font-weight:bold;cursor:pointer}
@media(max-width:520px){.container{padding:10px}header{padding:16px}h1{font-size:20px}.card{padding:17px}.question{font-size:19px}.option{font-size:15px;padding:13px}}

</header>

<div class="progress"><div id="bar"></div></div>

<div id="tag" class="tag"></div>
<div id="qnum" class="num"></div>
<div id="question" class="question"></div>
<div id="options"></div>
<div id="feedback" class="feedback"></div>
<button id="next" class="next" onclick="nextQuestion()">Siguiente →</button>
</div>

<div id="final" class="card final">
<h2>¡Práctica terminada!</h2>
<p id="result"></p>
<button class="reset" onclick="restart()">Reiniciar práctica</button>
</div>

let index=0, correct=0, wrong=0, answered=false;

function render(){
  answered=false;
  const q=questions[index];
  document.getElementById('tag').textContent=q.t;
  document.getElementById('qnum').textContent='Pregunta '+(index+1)+' de '+questions.length;
  document.getElementById('current').textContent=(index+1)+'/'+questions.length;
  document.getElementById('question').textContent=q.q;
  document.getElementById('bar').style.width=((index)/questions.length*100)+'%';
  const box=document.getElementById('options');
  box.innerHTML='';
  q.o.forEach((opt,i)=>{
    const b=document.createElement('button');
    b.className='option';
    b.textContent=String.fromCharCode(65+i)+') '+opt;
    b.onclick=()=>answer(i);
    box.appendChild(b);
  });
  const f=document.getElementById('feedback');
  f.className='feedback'; f.innerHTML='';
  document.getElementById('next').style.display='none';
}

function answer(choice){
  if(answered) return;
  answered=true;
  const q=questions[index];
  const buttons=document.querySelectorAll('.option');
  buttons.forEach((b,i)=>{b.disabled=true; if(i===q.a)b.classList.add('correct')});
  const f=document.getElementById('feedback');
  if(choice===q.a){
    correct++;
    f.className='feedback ok';
    f.innerHTML='<strong>✓ Correcto.</strong> '+q.e;
  } else {
    wrong++;
    buttons[choice].classList.add('incorrect');
    f.className='feedback no';
    f.innerHTML='<strong>✗ Incorrecto.</strong> La respuesta correcta es <strong>'+String.fromCharCode(65+q.a)+') '+q.o[q.a]+'</strong>. '+q.e;
  }
  document.getElementById('correct').textContent=correct;
  document.getElementById('wrong').textContent=wrong;
  document.getElementById('next').style.display='block';
}

function nextQuestion(){
  index++;
  if(index>=questions.length) finish(); else render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function finish(){
  document.getElementById('quiz').style.display='none';
  document.getElementById('final').style.display='block';
  document.getElementById('bar').style.width='100%';
  const pct=Math.round(correct/questions.length*100);
  document.getElementById('result').innerHTML='<strong>'+correct+' correctas</strong> y <strong>'+wrong+' incorrectas</strong>.<br>Resultado: <strong>'+pct+'%</strong>';
}

function restart(){
  index=0; correct=0; wrong=0;
  document.getElementById('correct').textContent='0';
  document.getElementById('wrong').textContent='0';
  document.getElementById('final').style.display='none';
  document.getElementById('quiz').style.display='block';
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
